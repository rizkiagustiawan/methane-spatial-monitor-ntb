version: '3.8'

services:
  geoesg_db:
    image: postgis/postgis:15-3.3
    container_name: geoesg_db
    environment:
      POSTGRES_USER: geo_admin
      POSTGRES_PASSWORD: geo_secure_password
      POSTGRES_DB: geoesg_aeco
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - geoesg_data:/var/lib/postgresql/data
    restart: always

  api:
    build: .
    container_name: geoesg_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - geoesg_db
    restart: always

volumes:
  geoesg_data:
