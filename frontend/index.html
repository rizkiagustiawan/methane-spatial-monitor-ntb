<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTB Methane Tracker Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #111; font-family: 'Courier New', monospace; color: #fff; }
        #map { height: 100vh; width: 100vw; }
        
        .map-title {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0,0,0,0.8); color: #0f0;
            padding: 10px 20px; border: 1px solid #0f0; letter-spacing: 2px;
        }

        .alert-banner {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255,0,0,0.9); color: white;
            padding: 15px 30px; border: 2px solid #fff; font-weight: bold;
            display: none; animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.5; } }

        .dashboard {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(0,0,0,0.8); border: 1px solid #0f0; padding: 15px;
            width: 250px;
        }

        .dashboard h3 { margin: 0 0 10px 0; color: #0f0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .stat-val { color: #0f0; font-weight: bold; }

        .legend {
            position: absolute; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(0,0,0,0.8); border: 1px solid #555; padding: 15px;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 13px; }
        .legend-color { width: 15px; height: 15px; margin-right: 10px; border: 1px solid #fff; }
    </style>
</head>
<body>
    <div class="map-title">NTB METHANE TRACKER</div>
    <div id="alertBanner" class="alert-banner">🚨 EVACUATION ALERT: TOXIC PLUME DETECTED 🚨</div>
    
    <div class="dashboard">
        <h3>SYSTEM STATS</h3>
        <div class="stat-row"><span>Status:</span> <span id="sysStatus" class="stat-val">Loading...</span></div>
        <div class="stat-row"><span>Active Plumes:</span> <span id="statPlumes" class="stat-val">-</span></div>
        <div class="stat-row"><span>Max Emission:</span> <span id="statMax" class="stat-val">-</span></div>
        <div class="stat-row"><span>Active Alerts:</span> <span id="statAlerts" class="stat-val" style="color:red">-</span></div>
        <div class="stat-row"><span>Weather Node:</span> <span id="statWeather" class="stat-val">-</span></div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#0f0; border-radius:50%"></div> Methane Plume Source</div>
        <div class="legend-item"><div class="legend-color" style="background:rgba(0,255,0,0.3)"></div> Observed Plume Footprint</div>
        <div class="legend-item"><div class="legend-color" style="background:rgba(255,165,0,0.3)"></div> Forecasted Dispersion</div>
        <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,0.5)"></div> Evacuation Zone Alert</div>
        <div class="legend-item"><div class="legend-color" style="background:rgba(100,100,255,0.2)"></div> Populated Zone</div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([-8.65, 116.12], 9);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

        let plumesLayer = L.layerGroup().addTo(map);
        let observedLayer = L.layerGroup().addTo(map);
        let forecastLayer = L.layerGroup().addTo(map);
        let zonesLayer = L.layerGroup().addTo(map);

        L.control.layers(null, {
            "Methane Sources": plumesLayer,
            "Observed Plumes": observedLayer,
            "Forecast Plumes": forecastLayer,
            "Populated Zones": zonesLayer
        }, { position: 'topright' }).addTo(map);

        async function fetchHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                document.getElementById('sysStatus').innerText = data.status;
                document.getElementById('sysStatus').style.color = data.status === 'HEALTHY' ? '#0f0' : 'red';
            } catch (e) {}
        }

        async function fetchZones() {
            try {
                const res = await fetch('/api/zones');
                const data = await res.json();
                zonesLayer.clearLayers();
                L.geoJSON(data, {
                    style: function(f) {
                        return { color: f.properties.is_volcanic_zone ? '#ff00ff' : '#6464ff', weight: 1, fillOpacity: 0.1 };
                    },
                    onEachFeature: (f, l) => l.bindPopup(`${f.properties.name} (${f.properties.type})`)
                }).addTo(zonesLayer);
            } catch (e) {}
        }

        async function fetchData() {
            try {
                const [plumesRes, analysisRes] = await Promise.all([
                    fetch('/api/methane/plumes'),
                    fetch('/api/plume-analysis')
                ]);
                
                const plumes = await plumesRes.json();
                const analyses = await analysisRes.json();

                plumesLayer.clearLayers();
                observedLayer.clearLayers();
                forecastLayer.clearLayers();

                let activeAlerts = 0;
                let maxEmission = 0;

                // Render Plume Analysis (Observed + Forecast)
                if (analyses && analyses.length > 0) {
                    analyses.forEach(a => {
                        maxEmission = Math.max(maxEmission, a.emission_rate_kg_hr);

                        // Render Observed Plume Footprint
                        if (a.observed && a.observed.plume_footprint) {
                            if (a.observed.exposure_alert) activeAlerts++;
                            
                            const style = a.observed.exposure_alert
                                ? { color: '#ff0000', weight: 3, fillColor: '#ff0000', fillOpacity: 0.4, dashArray: '10,5' }
                                : { color: '#00ff00', weight: 2, fillColor: '#00ff00', fillOpacity: 0.2 };

                            const zones = a.observed.affected_zones.map(z => z.zone_name).join(', ') || 'None';
                            const content = `
                                <div style="background:#222; color:${a.observed.exposure_alert?'#ff0000':'#00ff00'}; padding:5px;">
                                    <b>OBSERVED PLUME</b><br>
                                    Source: ${a.observed.source}<br>
                                    Rate: ${a.emission_rate_kg_hr.toFixed(1)} kg/hr<br>
                                    Time: ${new Date(a.recorded_at).toLocaleString()}<br>
                                    Affected Zones: ${zones}
                                </div>`;

                            L.geoJSON(a.observed.plume_footprint, { style }).bindPopup(content).addTo(observedLayer);
                        }

                        // Render Forecasted Plumes
                        if (a.forecast && a.forecast.length > 0) {
                            a.forecast.forEach((fc, idx) => {
                                if (fc.exposure_alert) activeAlerts++;

                                const style = fc.exposure_alert
                                    ? { color: 'red', weight: 2, fillColor: 'red', fillOpacity: 0.3, dashArray: '5,5' }
                                    : { color: 'orange', weight: 1, fillColor: 'orange', fillOpacity: 0.15 };

                                const zones = fc.affected_zones.map(z => z.zone_name).join(', ') || 'None';
                                const content = `
                                    <div style="background:#222; color:${fc.exposure_alert?'red':'orange'}; padding:5px;">
                                        <b>FORECAST #${idx + 1}</b><br>
                                        Valid: ${new Date(fc.valid_at).toLocaleString()}<br>
                                        Wind: ${fc.wind_speed_ms.toFixed(1)} m/s @ ${fc.wind_direction_deg}°<br>
                                        Class: ${fc.stability_class}<br>
                                        Conc @ 1km: ${fc.concentration_at_1km_ppm.toFixed(2)} ppm<br>
                                        Terrain Block: ${fc.terrain_blocked ? `Yes (${fc.terrain_block_distance_m.toFixed(0)}m)` : 'No'}<br>
                                        Affected Zones: ${zones}
                                    </div>`;

                                L.geoJSON(fc.plume_geojson, { style }).bindPopup(content).addTo(forecastLayer);
                            });
                        }
                    });
                }

                // Render Sources
                if (plumes && plumes.length > 0) {
                    const geoJson = {
                        type: "FeatureCollection",
                        features: plumes.map(p => ({
                            type: "Feature", geometry: p.geometry,
                            properties: { rate: p.emission_rate_kg_hr, time: p.recorded_at, source: p.source || 'unknown' }
                        }))
                    };
                    L.geoJSON(geoJson, {
                        pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, color: '#000', fillColor: '#0f0', fillOpacity: 1 }),
                        onEachFeature: (f, l) => l.bindPopup(`Source: ${f.properties.source}<br>Rate: ${f.properties.rate.toFixed(1)} kg/hr<br>Time: ${new Date(f.properties.time).toLocaleString()}`)
                    }).addTo(plumesLayer);
                }

                // Update Dashboard
                document.getElementById('statPlumes').innerText = plumes.length || 0;
                document.getElementById('statMax').innerText = maxEmission > 0 ? `${maxEmission.toFixed(1)} kg/hr` : '-';
                document.getElementById('statAlerts').innerText = activeAlerts;
                
                const banner = document.getElementById('alertBanner');
                banner.style.display = activeAlerts > 0 ? 'block' : 'none';

                // Fetch Weather info for dash
                fetch('/api/weather').then(r => r.json()).then(w => {
                    if (w && w.length > 0) document.getElementById('statWeather').innerText = w[0].data_source;
                });

            } catch (error) { console.error('Fetch error:', error); }
        }

        fetchHealth();
        fetchZones();
        fetchData();
        setInterval(fetchData, 60000); // 60s poll
        setInterval(fetchHealth, 60000);
    </script>
</body>
</html>
