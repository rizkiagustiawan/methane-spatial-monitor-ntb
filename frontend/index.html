<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTB Methane Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #111; }
        #map { height: 100vh; width: 100vw; }
        .map-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: #00ff00;
            padding: 10px 20px;
            border: 1px solid #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="map-title">NTB Methane Tracker - Real-time Plumes</div>
    <div id="map"></div>

    <script>
        // Initialize map centered on NTB
        const map = L.map('map').setView([-8.65, 116.12], 8);

        // Dark Matter Basemap
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Fetch Methane Plumes
        async function fetchPlumes() {
            try {
                const response = await fetch('http://localhost:3000/api/methane/plumes');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();

                // Convert array to GeoJSON FeatureCollection
                const geoJson = {
                    type: "FeatureCollection",
                    features: data.map(plume => ({
                        type: "Feature",
                        geometry: plume.geometry,
                        properties: {
                            recorded_at: plume.recorded_at,
                            emission_rate: plume.emission_rate_kg_hr
                        }
                    }))
                };

                // Add to map
                L.geoJSON(geoJson, {
                    style: {
                        color: "#00ff00",
                        weight: 2,
                        opacity: 0.6,
                        fillOpacity: 0.3
                    },
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 8,
                            fillColor: "#00ff00",
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup(`
                            <div style="background: #222; color: #00ff00; font-family: monospace; padding: 5px;">
                                <strong>METHANE PLUME</strong><br>
                                Emission: ${feature.properties.emission_rate.toFixed(2)} kg/hr<br>
                                Recorded: ${new Date(feature.properties.recorded_at).toLocaleString()}
                            </div>
                        `);
                    }
                }).addTo(map);

                console.log(`Loaded ${data.length} plumes.`);
            } catch (error) {
                console.error('Error fetching plumes:', error);
            }
        }

        async function fetchPrediction() {
            try {
                const response = await fetch('http://localhost:3000/api/plume-prediction');
                const data = await response.json();
                
                if (!data || !data.plume_line_json) return;

                const geometry = typeof data.plume_line_json === 'string' 
                    ? JSON.parse(data.plume_line_json) 
                    : data.plume_line_json;

                const style = data.exposure_alert 
                    ? { color: 'red', weight: 4, fillColor: 'red', fillOpacity: 0.4, dashArray: '5, 10' }
                    : { color: "#ff3300", weight: 2, fillColor: "#ff3300", fillOpacity: 0.3, dashArray: "5, 5" };

                let popupContent = `
                    <div style="background: #222; color: ${data.exposure_alert ? 'red' : '#ff3300'}; font-family: monospace; padding: 5px; border: 1px solid ${data.exposure_alert ? 'red' : '#ff3300'};">
                        <strong>${data.exposure_alert ? '🚨 EVACUATION ALERT' : '⚠️ PREDIKSI SEBARAN GAS'}</strong><br>
                        Kecepatan Angin: ${data.wind_speed_ms.toFixed(2)} m/s<br>
                        Arah Angin: ${data.wind_direction_deg}°<br>
                        ${data.high_uncertainty_smear ? '<span style="color: #ffaa00;">⚠️ Sat-Smear Limit Warning</span>' : ''}
                    </div>
                `;

                L.geoJSON(geometry, { style: style }).addTo(map).bindPopup(popupContent);

                console.log("Plume prediction loaded.");
            } catch (error) {
                console.error('Error fetching prediction:', error);
            }
        }

        fetchPlumes();
        fetchPrediction();
    </script>
</body>
</html>
